[/Script/Engine.InputSettings]
; Enhanced Input replaces the legacy axis/action mapping system entirely.
; Without these two lines UEnhancedInputComponent is never created and every
; BindAction call in AFarmCharacter silently does nothing.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=False
bViewAccelerationEnabled=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

[/Script/Engine.RendererSettings]
; --- Global illumination and reflections -------------------------------
; Lumen is the reason this project can look good without baking lighting,
; and it is what makes the Phase 7 time-of-day presets cheap to author.
; Software tracing (no hardware ray tracing) is chosen deliberately: it runs
; on far more GPUs and the stylised target does not need mirror reflections.
; Revisit hardware RT in Phase 12 once there is real content to profile.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=0

; Lumen's software tracing reads mesh distance fields. Without this, Lumen
; silently falls back to screen traces only and indoor areas go black.
r.GenerateMeshDistanceFields=True

r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.Nanite.ProjectEnabled=True

; --- Comfort ------------------------------------------------------------
; The brief rules these out for a relaxing experience. Setting them at the
; project level means every new camera and post-process volume inherits the
; comfortable default instead of having to remember to switch them off.
r.DefaultFeature.MotionBlur=False
r.MotionBlurQuality=0
r.DefaultFeature.LensFlare=False
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=1
r.DefaultFeature.AutoExposure.Bias=1.0

r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000

